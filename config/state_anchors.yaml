# ONE anchor metro per state -- the metro whose REAL NASA POWER grid
# represents that state heat pipeline. Wages are state-level (legislated per
# state); heat stays metro-scale (physical, not legislative) because averaging
# a whole state into one number would destroy the micro-climate premise the
# STGCN exists for. Metro = largest populated place in the state by Natural
# Earth pop_max (real public-domain data), unless a reason below overrides it.
# bbox = metro coords +/-1.005deg (~2.01x2.01deg, a margin above, satisfying NASA POWER regional
# >=2deg span; node count is data-driven from what POWER returns, never fixed.
